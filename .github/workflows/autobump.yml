name: Bump CloudCover

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
      - .github/scripts/bump-cloudcover.py
  workflow_dispatch:
  schedule:
    # Every day at 19:55 UTC
    - cron: 55 19 * * *

permissions: {}

concurrency:
  group: cloudcover-autobump
  cancel-in-progress: false

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Bump all CloudCover platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate --slurp repos/cyruscook/cloudcover/releases > "$RUNNER_TEMP/releases.json"
          version=$(python3 .github/scripts/bump-cloudcover.py < "$RUNNER_TEMP/releases.json")
          if git diff --quiet -- Formula/cloudcover.rb; then
            exit 0
          fi
          branch="bump-cloudcover-$version"
          if [[ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]]; then
            exit 0
          fi
          brew style Formula/cloudcover.rb
          brew audit --strict cyruscook/tap/cloudcover
          git switch -c "$branch"
          git add Formula/cloudcover.rb
          git commit -m "cloudcover $version"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "cloudcover $version" \
            --body "Update all four platform archives and SHA-256 checksums from the CloudCover CLI release asset metadata."
