name: Bump CloudCover

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
      - .github/scripts/bump-cloudcover.py
      - .github/scripts/publish-cloudcover-bump.sh
  workflow_dispatch:
  schedule:
    # Every day at 19:55 UTC
    - cron: 55 19 * * *

permissions: {}

concurrency:
  group: cloudcover-autobump
  cancel-in-progress: false

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1

      - name: Bump all CloudCover platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate --slurp repos/cyruscook/cloudcover/releases > "$RUNNER_TEMP/releases.json"
          version=$(python3 .github/scripts/bump-cloudcover.py < "$RUNNER_TEMP/releases.json")
          if git diff --quiet -- Formula/cloudcover.rb; then
            exit 0
          fi
          bash .github/scripts/publish-cloudcover-bump.sh "$version"
